services:
  vpn:
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${OPENVPN_USER:?no .env}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:?no .env}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port
      - SERVER_REGIONS=${VPN_SERVER_REGIONS:?no .env}
      - TZ=${TZ:?no .env}
      - UPDATER_PERIOD=24h
    volumes:
      - ${CONFIG_ROOT:?no .env}/gluetun:/gluetun
    ports:
      - 8080:8080  # qBittorrent web UI
      - 30221:30221  # forwarded port
      - 5010:5010   # Mousehole
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    mem_limit: 256m
    mem_reservation: 128m
    oom_score_adj: -500
    restart: unless-stopped

  torrent:
    image: ghcr.io/linuxserver/qbittorrent
    network_mode: service:vpn
    environment:
      - PUID=${PUID:?no .env}
      - PGID=${PGID:?no .env}
      - WEBUI_PORT=8080
      - TZ=${TZ:?no .env}
    volumes:
      - ${CONFIG_ROOT:?no .env}/qbittorrent:/config
      - ${CONFIG_ROOT:?no .env}/gluetun:/gluetun
      - ${DATA_ROOT:?no .env}/Torrents:/downloads
      - ${DATA_ROOT:?no .env}/Audio_books:/audiobooks
    depends_on:
      vpn:
        condition: service_healthy
    mem_limit: 1g
    mem_reservation: 512m
    oom_score_adj: -500
    restart: unless-stopped

  port-updater:
    image: snoringdragon/gluetun-qbittorrent-port-manager:latest
    container_name: torrent-port-updater
    network_mode: service:vpn
    environment:
      - QBITTORRENT_HOST=localhost
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_USER=${QBITTORRENT_USER:?no .env}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS:?no .env}
      - GLUETUN_CONTROL_PORT=8000
      - INTERVAL=60
      - TZ=${TZ:?no .env}
    volumes:
      - ${CONFIG_ROOT:?no .env}/gluetun:/tmp/gluetun
    depends_on:
      torrent:
        condition: service_started
      vpn:
        condition: service_healthy
    mem_limit: 64m
    mem_reservation: 32m
    oom_score_adj: -500
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID:?no .env}
      - PGID=${PGID:?no .env}
      - TZ=${TZ:?no .env}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:?no .env}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${CONFIG_ROOT:?no .env}/plex:/config
      - ${DATA_ROOT:?no .env}/Series:/tv
      - ${DATA_ROOT:?no .env}/Movies:/movies
    runtime: nvidia
    mem_limit: 1536m
    mem_reservation: 768m
    oom_score_adj: -400
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:?no .env}
      - PGID=${PGID:?no .env}
      - TZ=${TZ:?no .env}
    volumes:
      - ${CONFIG_ROOT:?no .env}/radarr:/config
      - ${DATA_ROOT:?no .env}/Movies:/movies
      - ${DATA_ROOT:?no .env}/Torrents:/downloads
    ports:
      - 7878:7878
    mem_limit: 512m
    mem_reservation: 256m
    oom_score_adj: -400
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:?no .env}
      - PGID=${PGID:?no .env}
      - TZ=${TZ:?no .env}
    volumes:
      - ${CONFIG_ROOT:?no .env}/sonarr:/config
      - ${DATA_ROOT:?no .env}/Series:/tv
      - ${DATA_ROOT:?no .env}/Torrents:/downloads
    ports:
      - 8989:8989
    mem_limit: 512m
    mem_reservation: 256m
    oom_score_adj: -400
    restart: unless-stopped

  overseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: overseerr
    init: true
    environment:
      - TZ=${TZ:?no .env}
      - PORT=5055
    volumes:
      - ${CONFIG_ROOT:?no .env}/overseerr:/app/config
    ports:
      - 5055:5055
    mem_limit: 384m
    mem_reservation: 192m
    oom_score_adj: -200
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    environment:
      - TZ=${TZ:?no .env}
    ports:
      - 13378:80
    volumes:
      - ${DATA_ROOT:?no .env}/Audio_books:/audiobooks
      - ${CONFIG_ROOT:?no .env}/audiobookshelf_metadata:/metadata
      - ${CONFIG_ROOT:?no .env}/audibookshelf:/config
      - ${DATA_ROOT:?no .env}/Torrents:/downloads
    mem_limit: 768m
    mem_reservation: 384m
    oom_score_adj: -500
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - ${DATA_ROOT:?no .env}:${DATA_ROOT:?no .env}:ro
      - ${CONFIG_ROOT:?no .env}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=localhost,127.0.0.1,home.mitrenga.work,mitrenga.work
      - TZ=${TZ:?no .env}
    mem_limit: 192m
    mem_reservation: 64m
    oom_score_adj: 100
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ:?no .env}
    ports:
      - 8191:8191
    mem_limit: 512m
    mem_reservation: 128m
    oom_score_adj: -300
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_ROOT:?no .env}/portainer/portainer_data:/data
    ports:
      - 9443:9443
    mem_limit: 256m
    mem_reservation: 64m
    oom_score_adj: 100
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:?no .env}
      - PGID=${PGID:?no .env}
      - TZ=${TZ:?no .env}
    volumes:
      - ${CONFIG_ROOT:?no .env}/prowlarr:/config
    ports:
      - 9696:9696
    mem_limit: 512m
    mem_reservation: 256m
    oom_score_adj: -400
    restart: unless-stopped

  audiobookrequest:
    image: markbeep/audiobookrequest:1
    container_name: audiobookrequest
    environment:
      - PUID=${PUID:?no .env}
      - PGID=${PGID:?no .env}
      - TZ=${TZ:?no .env}
    volumes:
      - ${CONFIG_ROOT:?no .env}/audiobookrequest:/config
    ports:
      - 8001:8000
    mem_limit: 256m
    mem_reservation: 128m
    oom_score_adj: -500
    restart: unless-stopped

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    ports:
      - 80:80
      - 443:443
      - 81:81   # NPM admin UI
    volumes:
      - ${CONFIG_ROOT:?no .env}/npm/data:/data
      - ${CONFIG_ROOT:?no .env}/npm/letsencrypt:/etc/letsencrypt
    mem_limit: 256m
    mem_reservation: 128m
    oom_score_adj: -300
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?no .env}
    mem_limit: 128m
    mem_reservation: 64m
    oom_score_adj: -300
    restart: unless-stopped

  mam-ip-updater:
    image: tmmrtn/mousehole:latest
    container_name: mam-ip-updater
    network_mode: service:vpn
    environment:
      - TZ=${TZ:?no .env}
      - MOUSEHOLE_AUTH_PASSWORD=${MOUSEHOLE_AUTH_PASSWORD:?no .env}
    volumes:
      - ${CONFIG_ROOT:?no .env}/mousehole:/srv/mousehole
    depends_on:
      vpn:
        condition: service_healthy
    mem_limit: 64m
    mem_reservation: 32m
    oom_score_adj: -500
    restart: unless-stopped

  excalidraw:
    image: ghcr.io/ozencb/excalidraw-persist:latest
    container_name: excalidraw
    ports:
      - 5051:80
    volumes:
      - ${CONFIG_ROOT:?no .env}/excalidraw:/app/data
    mem_limit: 128m
    mem_reservation: 32m
    oom_score_adj: 200
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich
    environment:
      - TZ=${TZ:?no .env}
      - DB_HOSTNAME=immich-database
      - DB_USERNAME=${IMMICH_DB_USER:?no .env}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:?no .env}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:?no .env}
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - ${DATA_ROOT:?no .env}/Photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 2283:2283
    depends_on:
      - immich-redis
      - immich-database
    mem_limit: 1g
    mem_reservation: 256m
    oom_score_adj: 800
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release-cuda
    container_name: immich-machine-learning
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${CONFIG_ROOT:?no .env}/immich/model-cache:/cache
    mem_limit: 1280m
    mem_reservation: 128m
    oom_score_adj: 900
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:8-bookworm
    container_name: immich-redis
    mem_limit: 256m
    mem_reservation: 64m
    oom_score_adj: 600
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-database
    environment:
      - POSTGRES_USER=${IMMICH_DB_USER:?no .env}
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD:?no .env}
      - POSTGRES_DB=${IMMICH_DB_NAME:?no .env}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${CONFIG_ROOT:?no .env}/immich/postgres:/var/lib/postgresql/data
    mem_limit: 512m
    mem_reservation: 192m
    oom_score_adj: 600
    restart: unless-stopped

  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    environment:
      - TZ=${TZ:?no .env}
    cap_add:
      - SYS_RAWIO
    ports:
      - 8085:8080
    volumes:
      - /run/udev:/run/udev:ro
      - ${CONFIG_ROOT:?no .env}/scrutiny:/opt/scrutiny/config
      - ${CONFIG_ROOT:?no .env}/scrutiny_influxdb:/opt/scrutiny/influxdb
    devices:
      - /dev/sda
      - /dev/sdb
      - /dev/sdc
    mem_limit: 384m
    mem_reservation: 64m
    oom_score_adj: 300
    restart: unless-stopped
